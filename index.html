<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Premium Glass Edition</title>
    <meta name="description" content="A premium, Apple-inspired Tic Tac Toe game with glassmorphism design and smooth animations.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="game-container">
        <header>
            <h1>Tic Tac Toe</h1>
            <div id="status" class="status">Player <span id="current-player">X</span>'s Turn</div>
        </header>

        <div id="board" class="board">
            <div class="cell" data-index="0" id="cell-0"></div>
            <div class="cell" data-index="1" id="cell-1"></div>
            <div class="cell" data-index="2" id="cell-2"></div>
            <div class="cell" data-index="3" id="cell-3"></div>
            <div class="cell" data-index="4" id="cell-4"></div>
            <div class="cell" data-index="5" id="cell-5"></div>
            <div class="cell" data-index="6" id="cell-6"></div>
            <div class="cell" data-index="7" id="cell-7"></div>
            <div class="cell" data-index="8" id="cell-8"></div>
        </div>

        <button id="reset-btn" class="reset-btn hidden">Play Again</button>
    </main>

    <div id="win-overlay" class="win-overlay hidden">
        <div class="win-card">
            <h2 id="win-message">X Wins!</h2>
            <button id="overlay-reset-btn" class="primary-btn">Start New Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
